<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>BlockCore Engine</title>
  
<!-- Load Blockly core -->
<script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
<!-- Load the default blocks -->
<script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
<!-- Load a generator -->
<script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
<!-- Load a message file -->
<script src="https://unpkg.com/blockly/msg/en.js"></script>



  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #f4f4f4; padding: 20px; }
    h1 { color: #007acc; }
    .tabs-menu { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
    .tab-btn { background: #333; color: #bbb; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px 4px 0 0; margin-right: 5px; }
    .tab-btn.active { background: #007acc; color: #fff; font-weight: bold; }
    .export-btn { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; float: right; border-radius: 4px; font-weight: bold; }
    .tab-content { display: none; background: #252526; padding: 20px; border-radius: 4px; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 15px; }
    input[type="text"] { background: #3c3c3c; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; width: 200px; }
    #blocklyDiv { height: 700px; width: 100%; border: 1px solid #444; }
    .code-box { width: 100%; height: 200px; background: #1a1a1a; color: #fff; border: 1px solid #444; font-family: monospace; padding: 10px; resize: none; box-sizing: border-box; }
  </style>
</head>
<body>

  <h1>🎮 GBA Lua Creator</h1>
  
  <div class="tabs-container">
    <!-- Menu Nawigacji -->
    <div class="tabs-menu">
      <button class="tab-btn active" onclick="switchTab('details')">📝 Details</button>
      <button class="tab-btn" onclick="switchTab('assets')">🖼️ Assets</button>
      <button class="tab-btn" onclick="switchTab('code')">🧩 Code</button>
      <button class="export-btn" onclick="exportProject()">💾 Generuj Kod</button>
    </div>

    <!-- ZAKŁADKA 1: DETAILS -->
    <div id="tab-details" class="tab-content active">
      <h2>Ustawienia Projektu GBA</h2>
      <div class="form-group">
        <label>Nazwa Gry: </label><input type="text" id="game-name" value="MojaGraGBA">
      </div>
      <div class="form-group">
        <label>Kod (4 litery): </label><input type="text" id="game-code" value="AGBA" maxlength="4">
      </div>
      <div class="form-group">
        <label>Autor: </label><input type="text" id="game-author" value="Anonim">
      </div>
    </div>

    <!-- ZAKŁADKA 2: ASSETS -->
    <div id="tab-assets" class="tab-content">
      <h2>Zasoby Graficzne (.bmp)</h2>
      <input type="file" id="asset-upload" accept=".bmp" onchange="addAsset()">
      <ul id="asset-list"></ul>
    </div>

    <!-- ZAKŁADKA 3: CODE -->
    <div id="tab-code" class="tab-content">
      <h2>Układanie Bloków (Lua 5.3)</h2>
      <div id="blocklyDiv"></div>
    </div>
  </div>

  <!-- OKNA PODGLĄDU NA DOLE STRONY -->
  <div style="margin-top: 30px; border-top: 2px solid #333; padding-top: 20px;">
    <h2>🔍 Wynikowe Pliki GBA</h2>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 250px;">
        <h3 style="color: #007acc;">📜 manifest.lua</h3>
        <textarea id="output-manifest" class="code-box" readonly></textarea>
      </div>
      <div style="flex: 1; min-width: 250px;">
        <h3 style="color: #007acc;">🕹️ main.lua</h3>
        <textarea id="output-main" class="code-box" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- ROZBUDOWANA PALETA BLOKÓW (TOOLBOX) -->
  <xml id="toolbox" style="display: none">
    <category name="Konstrukcja i Start" colour="#655ba5">
      <block type="gba_start"></block> <!-- NOWY KLOCEK STARTU -->
      <block type="gba_loop"></block>
      <block type="gba_break"></block>
    </category>
    
    <category name="Logika i Kolizje" colour="#5b80a5">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_boolean"></block>
      <block type="gba_collision"></block> <!-- NOWY KLOCEK KOLIZJI -->
    </category>
    
    <category name="Zmienne i Tekst" colour="#a55b80">
      <button text="Stwórz zmienną..." callbackKey="CREATE_VARIABLE"></button>
      <block type="variables_set"></block>
      <block type="variables_get"></block>
      <block type="math_number"></block>
      <block type="text"></block> <!-- KLOCEK DO WPISYWANIA TEKSTU -->
      <block type="math_arithmetic"></block>
    </category>
    
    <category name="GBA Sterowanie" colour="#995ba5">
      <block type="gba_btn"></block>
    </category>
    
    <category name="GBA Grafika" colour="#5ba55b">
      <block type="gba_txtr"></block>
      <block type="gba_clear"></block>
      <block type="gba_spr"></block>
      <block type="gba_print"></block> <!-- NOWY KLOCEK TEKSTU -->
      <block type="gba_display"></block>
    </category>
  </xml>



  <script>
    // === GLOBALNE ZMIENNE ===
let workspace;
let uploadedAssets = [];
// === REJESTRACJA KLOCKÓW GBA ===
// === REJESTRACJA KLOCKÓW GBA ===
window.onload = function() {
  
  // 1. WYKRYWANIE GENERATORA UNPKG (POTRÓJNE ZABEZPIECZENIE)
  const luaGen = (window.lua && window.lua.luaGenerator) ? window.lua.luaGenerator : 
                 (window.Lua && window.Lua.luaGenerator) ? window.Lua.luaGenerator : 
                 (window.Lua) ? window.Lua : Blockly.Lua;

  // 2. WYKRYWANIE TABLICY REJESTRACJI BLOKÓW
  const forBlock = luaGen.forBlock ? luaGen.forBlock : luaGen;

  // Konfiguracja wcięć dla BPCore-Engine
  if (luaGen) {
    luaGen.INDENT = '    ';
  }

  // --- DEFINICJE KLOCKÓW I ICH GENERATORÓW ---

  // 1. Pętla Gry
  Blockly.Blocks['gba_loop'] = {
    init: function() {
      this.appendDummyInput().appendField("Pętla Gry (Zawsze)");
      this.appendStatementInput("DO").appendField("wykonuj:");
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(120);
    }
  };
  // ZMIANA: Przypisujemy do uniwersalnego obiektu forBlock wykrytego powyżej
  forBlock['gba_loop'] = function(block) {
    const doCode = luaGen.statementToCode(block, 'DO');
    return 'while true do\n' + doCode + 'end\n';
  };

  // 7. Klocek: Wyjście z pętli na warunek (break)
  Blockly.Blocks['gba_break'] = {
    init: function() {
      this.appendDummyInput().appendField("wyjdź z pętli gry");
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(120);
    }
  };
  forBlock['gba_break'] = function(block) {
    return 'break\n';
  };

  // 8. Klocek KAPELUSZ: Kiedy uruchomiono (Start)
  Blockly.Blocks['gba_start'] = {
    init: function() {
      this.appendDummyInput().appendField("🏁 Kiedy uruchomiono (Start)");
      this.setNextStatement(true);
      this.setColour(65);
    }
  };
  forBlock['gba_start'] = function(block) {
    return ''; 
  };

  // 9. Klocek: Narysuj tekst (Print)
  Blockly.Blocks['gba_print'] = {
    init: function() {
      this.appendDummyInput().appendField("Narysuj tekst:");
      this.appendValueInput("TEKST").setCheck("String");
      this.appendDummyInput().appendField("X:");
      this.appendValueInput("X").setCheck("Number");
      this.appendDummyInput().appendField("Y:");
      this.appendValueInput("Y").setCheck("Number");
      this.setInputsInline(true);
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(160);
    }
  };
  forBlock['gba_print'] = function(block) {
    const t = luaGen.valueToCode(block, 'TEKST', luaGen.ORDER_ATOMIC) || '" "';
    const x = luaGen.valueToCode(block, 'X', luaGen.ORDER_ATOMIC) || '0';
    const y = luaGen.valueToCode(block, 'Y', luaGen.ORDER_ATOMIC) || '0';
    return 'print(' + t + ', ' + x + ', ' + y + ')\n';
  };

  // 10. Klocek: Czy kolizja AABB
  Blockly.Blocks['gba_collision'] = {
    init: function() {
      this.appendDummyInput().appendField("Kolizja obiektu 1 X:");
      this.appendValueInput("X1").setCheck("Number");
      this.appendDummyInput().appendField("Y:");
      this.appendValueInput("Y1").setCheck("Number");
      this.appendDummyInput().appendField("z obiektem 2 X:");
      this.appendValueInput("X2").setCheck("Number");
      this.appendDummyInput().appendField("Y:");
      this.appendValueInput("Y2").setCheck("Number");
      this.setInputsInline(true);
      this.setOutput(true, "Boolean");
      this.setColour(210);
    }
  };
  forBlock['gba_collision'] = function(block) {
    const x1 = luaGen.valueToCode(block, 'X1', luaGen.ORDER_ATOMIC) || '0';
    const y1 = luaGen.valueToCode(block, 'Y1', luaGen.ORDER_ATOMIC) || '0';
    const x2 = luaGen.valueToCode(block, 'X2', luaGen.ORDER_ATOMIC) || '0';
    const y2 = luaGen.valueToCode(block, 'Y2', luaGen.ORDER_ATOMIC) || '0';
    const formula = x1 + ' < ' + x2 + ' + 16 and ' + x1 + ' + 16 > ' + x2 + ' and ' + y1 + ' < ' + y2 + ' + 16 and ' + y1 + ' + 16 > ' + y2;
    return [formula, luaGen.ORDER_ATOMIC];
  };

    // 2. Wczytywanie tekstur (txtr)
  Blockly.Blocks['gba_txtr'] = {
    init: function() {
      this.appendDummyInput().appendField("Wczytaj teksturę");
      this.appendValueInput("WARSTWA").setCheck("Number").appendField("warstwa:");
      this.appendValueInput("PLIK").setCheck("String").appendField("plik .bmp:");
      this.setInputsInline(true);
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(20);
    }
  };
  forBlock['gba_txtr'] = function(block) {
    const w = luaGen.valueToCode(block, 'WARSTWA', luaGen.ORDER_ATOMIC) || '4';
    let p = luaGen.valueToCode(block, 'PLIK', luaGen.ORDER_ATOMIC);
    if (!p) {
      p = uploadedAssets.length > 0 ? '"' + uploadedAssets[0] + '"' : '"sprite.bmp"';
    }
    return 'txtr(' + w + ', ' + p + ')\n';
  };

  // 3. Czyszczenie ekranu (clear)
  Blockly.Blocks['gba_clear'] = {
    init: function() {
      this.appendDummyInput().appendField("Wyczyść ekran kolorem:");
      this.appendValueInput("KOLOR").setCheck("Number");
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(160);
    }
  };
  forBlock['gba_clear'] = function(block) {
    const k = luaGen.valueToCode(block, 'KOLOR', luaGen.ORDER_ATOMIC) || '0';
    return 'clear(' + k + ')\n';
  };

  // 4. Rysowanie obiektów (spr)
  Blockly.Blocks['gba_spr'] = {
    init: function() {
      this.appendDummyInput().appendField("Rysuj sprajta ID:");
      this.appendValueInput("ID").setCheck("Number");
      this.appendDummyInput().appendField("X:");
      this.appendValueInput("X").setCheck("Number");
      this.appendDummyInput().appendField("Y:");
      this.appendValueInput("Y").setCheck("Number");
      this.setInputsInline(true);
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(160);
    }
  };
  forBlock['gba_spr'] = function(block) {
    const id = luaGen.valueToCode(block, 'ID', luaGen.ORDER_ATOMIC) || '0';
    const x = luaGen.valueToCode(block, 'X', luaGen.ORDER_ATOMIC) || '0';
    const y = luaGen.valueToCode(block, 'Y', luaGen.ORDER_ATOMIC) || '0';
    return 'spr(' + id + ', ' + x + ', ' + y + ')\n';
  };

  // 5. Ekran wyświetlania (display)
  Blockly.Blocks['gba_display'] = {
    init: function() {
      this.appendDummyInput().appendField("Rysuj Klatkę (Display)");
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setColour(160);
    }
  };
  forBlock['gba_display'] = function(block) {
    return 'display()\n';
  };

  // 6. Przyciski pada GBA (btn)
  Blockly.Blocks['gba_btn'] = {
    init: function() {
      this.appendDummyInput()
          .appendField("przycisk")
          .appendField(new Blockly.FieldDropdown([
            ["A", "0"], ["B", "1"], ["SELECT", "2"], ["START", "3"],
            ["PRAWO", "4"], ["LEWO", "5"], ["GÓRA", "6"], ["DÓŁ", "7"],
            ["R (Trigger)", "8"], ["L (Trigger)", "9"]
          ]), "BUTTON");
      this.setOutput(true, "Boolean");
      this.setColour(210);
    }
  };
  forBlock['gba_btn'] = function(block) {
    const buttonId = block.getFieldValue('BUTTON');
    return ['btn(' + buttonId + ')', luaGen.ORDER_ATOMIC];
  };


  

  // INICJALIZACJA OBSZARU ROBOCZEGO
  workspace = Blockly.inject('blocklyDiv', {
    toolbox: document.getElementById('toolbox')
  });

  // DODATEK: Obsługa przycisku "Stwórz zmienną..." z menu bocznego
  if (workspace && workspace.registerButtonCallback) {
    workspace.registerButtonCallback('CREATE_VARIABLE', function(button) {
      Blockly.Variables.createVariableButtonHandler(button.getTargetWorkspace());
    });
  }

  // Odświeżenie wymiarów okna na start
  setTimeout(function() {
    if (workspace) { Blockly.svgResize(workspace); }
  }, 100);
}; // Koniec funkcji window.onload

// === FUNKCJA NAWIGACJI ===
function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  const targetTab = document.getElementById('tab-' + tabName);
  if (targetTab) { targetTab.classList.add('active'); }
  
  if (event && event.target) {
    event.target.classList.add('active');
  }

  if (tabName === 'code' && workspace) {
    setTimeout(function() {
      Blockly.svgResize(workspace);
    }, 50);
  }
}

// === OBSŁUGA ASSETÓW ===
function addAsset() {
  const fileInput = document.getElementById('asset-upload');
  if (!fileInput || fileInput.files.length === 0) return;
  const name = fileInput.files[0].name; // Całkowicie bezpieczne wyciąganie nazwy pliku z tablicy
  
  if (!uploadedAssets.includes(name)) {
    uploadedAssets.push(name);
    const li = document.createElement('li');
    li.style = "background:#333; padding:8px; margin-top:5px; border-radius:4px; display:flex; justify-content:space-between;";
    li.innerHTML = `<span>🖼️ ${name}</span> <button onclick="this.parentElement.remove(); uploadedAssets=uploadedAssets.filter(i=>i!='${name}');" style="background:#dc3545; color:white; border:none; border-radius:3px; cursor:pointer;">Usuń</button>`;
    document.getElementById('asset-list').appendChild(li);
  }
  fileInput.value = "";
}

// === OSTATECZNIE NAPRAWIONY EKSPORT PLIKÓW ===
// === GENEROWANIE I EKSPORT PLIKÓW (WERSJA DLA UNPKG) ===
function exportProject() {
  const n = document.getElementById('game-name').value || "GraGBA";
  const k = document.getElementById('game-code').value || "AGBA";
  const a = document.getElementById('game-author').value || "Anonim";
  
  // 1. SKANOWANIE KLOCKÓW W POSZUKIWANIU ASSETÓW
  // Jeśli użytkownik dodał klocek txtr i wpiął w niego tekst, automatycznie dodamy go do manifestu
  let dynamicAssets = [...uploadedAssets];
  if (workspace) {
    const allBlocks = workspace.getAllBlocks(false);
    allBlocks.forEach(block => {
      if (block.type === 'gba_txtr') {
        const fileBlock = block.getInputTargetBlock('PLIK');
        if (fileBlock && fileBlock.type === 'text') {
          const val = fileBlock.getFieldValue('TEXT');
          if (val && !dynamicAssets.includes(val)) {
            dynamicAssets.push(val);
          }
        }
      }
    });
  }

  // 2. BUDOWANIE PLIKU MANIFEST.LUA
  let manifestText = "-- Wygenerowano dla BPCore\n";
  manifestText += "local app = {\n";
  manifestText += '    name = "' + n + '",\n';
  manifestText += '    gamecode = "' + k + '",\n';
  manifestText += "    spritesheets = {\n";
  dynamicAssets.forEach(asset => { 
    manifestText += '        "' + asset + '",\n'; 
  });
  manifestText += "    },\n";
  manifestText += '    scripts = { "main.lua" }\n';
  manifestText += "}\nreturn app";
  
  // Natychmiastowe wrzucenie manifestu do okienka
  document.getElementById('output-manifest').value = manifestText;

  // 3. GENEROWANIE KODU MAIN.LUA (NOWY STANDARD UNPKG)
  let mainLuaText = "";
  
  try {
    // Oficjalny, globalny obiekt generatora dla najnowszej wersji unpkg
    const unpkgGenerator = window.lua ? window.lua.luaGenerator : Blockly.Lua;
    
    if (workspace && unpkgGenerator) {
      // Ustawienie wcięć dla czytelności kodu GBA
      unpkgGenerator.INDENT = '    ';
      
      // Wywołanie metody generowania kodu z klocków
      mainLuaText = unpkgGenerator.workspaceToCode(workspace);
    }
  } catch (err) {
    mainLuaText = "-- Błąd krytyczny generatora: " + err.message + "\n";
  }

  // Zabezpieczenie na wypadek, gdyby kod wyszedł pusty
  if (!mainLuaText || mainLuaText.trim() === "") {
    mainLuaText = "-- Układaj bloki, aby wygenerować kod main.lua";
  }

  // Wrzucenie gotowego kodu Lua do prawego okienka
  document.getElementById('output-main').value = mainLuaText;
}


  </script>
</body>
</html>
