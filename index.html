<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>BlockCore Engine</title>
  
  <!-- Core Blockly -->
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  
  <!-- Generator LUA -->
  <script src="https://unpkg.com/blockly/lua_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>

  <style>
    /* OGÓLNE STYLE STRONY (DARK THEME) */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #1e1e1e; 
      color: #f4f4f4; 
      margin: 0; 
      padding: 20px; 
    }
    h1 { color: #007acc; margin-top: 0; }
    
    /* MENU NAWIGACJI (ZAKŁADKI) */
    .tabs-menu { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
    .tab-btn { 
      background: #333; 
      color: #bbb; 
      border: none; 
      padding: 10px 25px; 
      cursor: pointer; 
      border-radius: 4px 4px 0 0; 
      font-size: 14px; 
      margin-right: 5px; 
      transition: 0.2s; 
    }
    .tab-btn:hover { background: #444; color: #fff; }
    .tab-btn.active { background: #007acc; color: #fff; font-weight: bold; }
    
    /* PRZYCISK GENEROWANIA KODU */
    .export-btn { 
      background: #28a745; 
      color: white; 
      border: none; 
      padding: 10px 20px; 
      cursor: pointer; 
      float: right; 
      border-radius: 4px; 
      font-weight: bold; 
    }
    .export-btn:hover { background: #218838; }
    
    /* KONTENERY ZAKŁADEK */
    .tab-content { 
      display: none; 
      background: #252526; 
      padding: 20px; 
      border-radius: 4px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
    }
    .tab-content.active { display: block; }
    
    /* FORMULARZE */
    .form-group { margin-bottom: 15px; }
    label { display: inline-block; width: 140px; font-weight: bold; }
    
    /* POLA TEKSTOWE NA STRONIE */
    input[type="text"] { 
      background: #f0f0f0; 
      color: #000000; 
      border: 1px solid #ccc; 
      padding: 8px; 
      border-radius: 4px; 
      width: 250px; 
      font-weight: 500;
    }
    
    /* KONTENER BLOCKLY */
    #blocklyDiv { 
      height: 700px; 
      width: 100%; 
      border: 1px solid #444; 
      border-radius: 4px; 
    } 
    
    /* RETRO OKNA KODU NA DOLE STRONY */
    .code-box { 
      width: 100%; 
      height: 250px; 
      background: #1a1a1a; 
      color: #fff; 
      border: 1px solid #444; 
      font-family: 'Courier New', Courier, monospace; 
      font-size: 14px; 
      line-height: 1.5; 
      padding: 12px; 
      resize: none; 
      box-sizing: border-box; 
      border-radius: 4px; 
    }

    /* MODYFIKACJE CZARNEGO TRYBU DLA GOOGLE BLOCKLY */
    .blocklyGridPattern line {
      stroke: #333333 !important;
    }

    .blocklyText,
    text.blocklyText,
    .blocklyFlyoutLabelText {
      fill: #ffffff !important;
      font-family: 'Segoe UI', sans-serif !important;
    }

    /* MENU ROZWIJANE (POPUP) */
    .blocklyDropdownMenu,
    .blocklyDropdownMenuDiv,
    div.blocklyDropdownMenuDiv,
    .goog-menu,
    .blocklyMenu {
      background-color: #e0e0e0 !important;
      border: 1px solid #aaa !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important;
      border-radius: 4px !important;
    }

    .goog-menuitem,
    .goog-menuitem-content,
    .goog-menuitem span,
    div.goog-menuitem-content,
    .blocklyMenuItem,
    .blocklyMenuItemContent {
      color: #000000 !important;
      font-family: sans-serif !important;
      font-size: 13px !important;
      font-weight: 500 !important;
    }

    .goog-menuitem-highlight,
    .goog-menuitem:hover,
    .blocklyMenuItemHighlight {
      background-color: #007acc !important;
    }
    .goog-menuitem-highlight .goog-menuitem-content,
    .goog-menuitem:hover .goog-menuitem-content,
    .blocklyMenuItemHighlight .blocklyMenuItemContent {
      color: #ffffff !important;
    }

    /* POLA INPUT / DROPDOWN / NUMBER NA KLOCKACH */
    .blocklyFieldDropdown text,
    .blocklyFieldVariable text,
    .blocklyFieldTextInput text,
    .blocklyFieldNumber text,
    .blocklyEditableText text,
    g.blocklyEditableText text,
    g.blocklyFieldDropdown text {
      fill: #000000 !important;
      font-weight: 600 !important;
    }

    .blocklyEditableText > rect,
    .blocklyFieldDropdown > rect,
    .blocklyFieldVariable > rect,
    .blocklyFieldTextInput > rect,
    .blocklyFieldNumber > rect {
      fill: #e0e0e0 !important;
      fill-opacity: 0.9 !important;
    }

    .blocklyDropdownTriangle {
      fill: #000000 !important;
    }

    .blocklyHtmlInput {
      background-color: #f0f0f0 !important;
      color: #000000 !important;
      border: 1px solid #999 !important;
      font-family: sans-serif !important;
      font-weight: bold !important;
      border-radius: 2px !important;
    }
  </style>

</head>

<body>

  <h1>BlockCore Engine</h1>
  
  <div class="tabs-container">
    <div class="tabs-menu">
      <button class="tab-btn active" onclick="switchTab('details')">📝 Details</button>
      <button class="tab-btn" onclick="switchTab('code')">🧩 Code</button>
      <button class="export-btn" onclick="exportProject()">💾 Generuj Kod</button>
    </div>

    <!-- ZAKŁADKA 1: DETAILS -->
    <div id="tab-details" class="tab-content active">
      <h2>GBA Game Details</h2>
      <div class="form-group">
        <label>Name: </label><input type="text" id="game-name" value="MojaGraGBA">
      </div>
      <div class="form-group">
        <label>Code: (4 letters): </label><input type="text" id="game-code" value="AGBA" maxlength="4">
      </div>
      <div class="form-group">
        <label>Author: </label><input type="text" id="game-author" value="Anonim">
      </div>
    </div>

    <!-- ZAKŁADKA 2: CODE -->
    <div id="tab-code" class="tab-content">
      <h2>Układanie Bloków (Lua 5.3)</h2>
      <div id="blocklyDiv"></div>
    </div>
  </div>

  <!-- OKNA PODGLĄDU NA DOLE STRONY -->
  <div style="margin-top: 30px; border-top: 2px solid #333; padding-top: 20px;">
    <h2>🔍 Wynikowe Pliki GBA</h2>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 250px;">
        <h3 style="color: #007acc;">📜 manifest.lua</h3>
        <textarea id="output-manifest" class="code-box" readonly></textarea>
      </div>
      <div style="flex: 1; min-width: 250px;">
        <h3 style="color: #007acc;">🕹️ main.lua</h3>
        <textarea id="output-main" class="code-box" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- TOOLBOX -->
  <xml id="toolbox" style="display: none">
    <category name="Konstrukcja i Czas" colour="#655ba5">
      <block type="gba_start"></block>
      <block type="gba_loop"></block>
      <block type="gba_wait_ms"></block>
      <block type="gba_break"></block>
    </category>
    
    <category name="Logika i Kolizje" colour="#5b80a5">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_boolean"></block>
      <block type="gba_collision"></block>
    </category>
    
    <category name="Zmienne i Matematyka" colour="#a55b80">
      <button text="Stwórz zmienną..." callbackKey="CREATE_VARIABLE"></button>
      <block type="variables_set"></block>
      <block type="variables_get"></block>
      <block type="math_number"></block>
      <block type="text"></block>
      <block type="math_arithmetic"></block>
      <block type="math_random_int"></block>
    </category>
    
    <category name="GBA Sterowanie" colour="#995ba5">
      <block type="gba_btn"></block>
      <block type="gba_btn_pressed"></block>
    </category>

    <category name="GBA Dźwięk" colour="#e67e22">
      <block type="gba_sound"></block>
    </category>
    
    <category name="GBA Grafika" colour="#5ba55b">
      <block type="gba_txtr"></block>
      <block type="gba_clear"></block>
      <block type="gba_spr"></block>
      <block type="gba_scroll"></block>
      <block type="gba_print"></block>
      <block type="gba_display"></block>
    </category>
  </xml>

  <script>
    let workspace;

    window.onload = function() {
      // 1. Definicja bloków JSON
      Blockly.defineBlocksWithJsonArray([
        {
          "type": "gba_loop",
          "message0": "Pętla Gry (Zawsze) %1 wykonuj: %2",
          "args0": [{"type": "input_dummy"}, {"type": "input_statement", "name": "DO"}],
          "previousStatement": null,
          "nextStatement": null,
          "colour": 120
        },
        {
          "type": "gba_wait_ms",
          "message0": "czekaj %1 ms (nieblokująco)",
          "args0": [{"type": "input_value", "name": "TIME", "check": "Number"}],
          "previousStatement": null,
          "nextStatement": null,
          "colour": 65
        },
        {
          "type": "gba_break",
          "message0": "wyjdź z pętli gry",
          "previousStatement": null,
          "nextStatement": null,
          "colour": 120
        },
        {
          "type": "gba_start",
          "message0": "🏁 Kiedy uruchomiono (Start)",
          "nextStatement": null,
          "colour": 65
        },
        {
          "type": "gba_txtr",
          "message0": "Wczytaj teksturę warstwa: %1 plik .bmp: %2",
          "args0": [
            {"type": "input_value", "name": "WARSTWA", "check": "Number"},
            {"type": "input_value", "name": "PLIK", "check": "String"}
          ],
          "inputsInline": true,
          "previousStatement": null,
          "nextStatement": null,
          "colour": 20
        },
        {
          "type": "gba_clear",
          "message0": "Wyczyść ekran kolorem: %1",
          "args0": [{"type": "input_value", "name": "KOLOR", "check": "Number"}],
          "previousStatement": null,
          "nextStatement": null,
          "colour": 160
        },
        {
          "type": "gba_spr",
          "message0": "Rysuj sprajta ID: %1 X: %2 Y: %3",
          "args0": [
            {"type": "input_value", "name": "ID", "check": "Number"},
            {"type": "input_value", "name": "X", "check": "Number"},
            {"type": "input_value", "name": "Y", "check": "Number"}
          ],
          "inputsInline": true,
          "previousStatement": null,
          "nextStatement": null,
          "colour": 160
        },
        {
          "type": "gba_scroll",
          "message0": "Ustaw kamerę X: %1 Y: %2",
          "args0": [
            {"type": "input_value", "name": "X", "check": "Number"},
            {"type": "input_value", "name": "Y", "check": "Number"}
          ],
          "inputsInline": true,
          "previousStatement": null,
          "nextStatement": null,
          "colour": 160
        },
        {
          "type": "gba_display",
          "message0": "Rysuj Klatkę (Display)",
          "previousStatement": null,
          "nextStatement": null,
          "colour": 160
        },
        {
          "type": "gba_print",
          "message0": "Narysuj tekst: %1 X: %2 Y: %3",
          "args0": [
            {"type": "input_value", "name": "TEKST", "check": "String"},
            {"type": "input_value", "name": "X", "check": "Number"},
            {"type": "input_value", "name": "Y", "check": "Number"}
          ],
          "inputsInline": true,
          "previousStatement": null,
          "nextStatement": null,
          "colour": 160
        },
        {
          "type": "gba_sound",
          "message0": "Odtwórz dźwięk plik .wav: %1",
          "args0": [{"type": "input_value", "name": "SFX_FILE", "check": "String"}],
          "previousStatement": null,
          "nextStatement": null,
          "colour": 30
        },
        {
          "type": "gba_btn",
          "message0": "przycisk %1 wciśnięty",
          "args0": [{
            "type": "field_dropdown",
            "name": "BUTTON",
            "options": [
              ["A", "0"], ["B", "1"], ["SELECT", "2"], ["START", "3"],
              ["PRAWO", "4"], ["LEWO", "5"], ["GÓRA", "6"], ["DÓŁ", "7"],
              ["R", "8"], ["L", "9"]
            ]
          }],
          "output": "Boolean",
          "colour": 210
        },
        {
          "type": "gba_btn_pressed",
          "message0": "przycisk %1 kliknięty (raz)",
          "args0": [{
            "type": "field_dropdown",
            "name": "BUTTON",
            "options": [
              ["A", "0"], ["B", "1"], ["SELECT", "2"], ["START", "3"],
              ["PRAWO", "4"], ["LEWO", "5"], ["GÓRA", "6"], ["DÓŁ", "7"],
              ["R", "8"], ["L", "9"]
            ]
          }],
          "output": "Boolean",
          "colour": 210
        },
        {
          "type": "gba_collision",
          "message0": "Kolizja obiektu 1 X: %1 Y: %2 z obiektem 2 X: %3 Y: %4",
          "args0": [
            {"type": "input_value", "name": "X1", "check": "Number"},
            {"type": "input_value", "name": "Y1", "check": "Number"},
            {"type": "input_value", "name": "X2", "check": "Number"},
            {"type": "input_value", "name": "Y2", "check": "Number"}
          ],
          "inputsInline": true,
          "output": "Boolean",
          "colour": 210
        },
        {
          "type": "math_random_int",
          "message0": "losowa liczba od %1 do %2",
          "args0": [
            {"type": "input_value", "name": "FROM", "check": "Number"},
            {"type": "input_value", "name": "TO", "check": "Number"}
          ],
          "inputsInline": true,
          "output": "Number",
          "colour": 230
        }
      ]);

      // 2. Przypisanie generatorów kodu Lua
      const lua = Blockly.Lua;
      lua.INDENT = '    ';

      lua.forBlock['gba_loop'] = function(block) {
        return 'while true do\n' +
               '    if _timer_ms > 0 then _timer_ms = _timer_ms - 16 end\n' +
               lua.statementToCode(block, 'DO') + 
               'end\n';
      };

      lua.forBlock['gba_wait_ms'] = function(block) {
        const ms = lua.valueToCode(block, 'TIME', lua.ORDER_ATOMIC) || '1000';
        return '_timer_ms = ' + ms + '\n' +
               'while _timer_ms > 0 do\n' +
               '    _timer_ms = _timer_ms - 16\n' +
               '    display()\n' +
               'end\n';
      };

      lua.forBlock['gba_break'] = function(block) { return 'break\n'; };
      lua.forBlock['gba_start'] = function(block) { return ''; };
      lua.forBlock['gba_display'] = function(block) { return 'display()\n'; };
      
      lua.forBlock['gba_clear'] = function(block) {
        const k = lua.valueToCode(block, 'KOLOR', lua.ORDER_ATOMIC) || '0';
        return 'clear(' + k + ')\n';
      };
      lua.forBlock['gba_txtr'] = function(block) {
        const w = lua.valueToCode(block, 'WARSTWA', lua.ORDER_ATOMIC) || '4';
        let p = lua.valueToCode(block, 'PLIK', lua.ORDER_ATOMIC) || '"sprite.bmp"';
        return 'txtr(' + w + ', ' + p + ')\n';
      };
      lua.forBlock['gba_spr'] = function(block) {
        const id = lua.valueToCode(block, 'ID', lua.ORDER_ATOMIC) || '0';
        const x = lua.valueToCode(block, 'X', lua.ORDER_ATOMIC) || '0';
        const y = lua.valueToCode(block, 'Y', lua.ORDER_ATOMIC) || '0';
        return 'spr(' + id + ', ' + x + ', ' + y + ')\n';
      };
      lua.forBlock['gba_scroll'] = function(block) {
        const x = lua.valueToCode(block, 'X', lua.ORDER_ATOMIC) || '0';
        const y = lua.valueToCode(block, 'Y', lua.ORDER_ATOMIC) || '0';
        return 'scroll(' + x + ', ' + y + ')\n';
      };
      lua.forBlock['gba_print'] = function(block) {
        const t = lua.valueToCode(block, 'TEKST', lua.ORDER_ATOMIC) || '" "';
        const x = lua.valueToCode(block, 'X', lua.ORDER_ATOMIC) || '0';
        const y = lua.valueToCode(block, 'Y', lua.ORDER_ATOMIC) || '0';
        return 'print(' + t + ', ' + x + ', ' + y + ')\n';
      };
      lua.forBlock['gba_sound'] = function(block) {
        let f = lua.valueToCode(block, 'SFX_FILE', lua.ORDER_ATOMIC) || '"sfx.wav"';
        return 'sfx(' + f + ')\n';
      };
      lua.forBlock['gba_btn'] = function(block) {
        return ['btn(' + block.getFieldValue('BUTTON') + ')', lua.ORDER_ATOMIC];
      };
      lua.forBlock['gba_btn_pressed'] = function(block) {
        return ['btnp(' + block.getFieldValue('BUTTON') + ')', lua.ORDER_ATOMIC];
      };
      lua.forBlock['gba_collision'] = function(block) {
        const x1 = lua.valueToCode(block, 'X1', lua.ORDER_ATOMIC) || '0';
        const y1 = lua.valueToCode(block, 'Y1', lua.ORDER_ATOMIC) || '0';
        const x2 = lua.valueToCode(block, 'X2', lua.ORDER_ATOMIC) || '0';
        const y2 = lua.valueToCode(block, 'Y2', lua.ORDER_ATOMIC) || '0';
        const f = x1 + ' < ' + x2 + ' + 16 and ' + x1 + ' + 16 > ' + x2 + ' and ' + y1 + ' < ' + y2 + ' + 16 and ' + y1 + ' + 16 > ' + y2;
        return [f, lua.ORDER_ATOMIC];
      };
      lua.forBlock['math_random_int'] = function(block) {
        const from = lua.valueToCode(block, 'FROM', lua.ORDER_ATOMIC) || '1';
        const to = lua.valueToCode(block, 'TO', lua.ORDER_ATOMIC) || '10';
        return ['math.random(' + from + ', ' + to + ')', lua.ORDER_ATOMIC];
      };

      // INICJALIZACJA OBSZARU ROBOCZEGO
      workspace = Blockly.inject('blocklyDiv', {
        toolbox: document.getElementById('toolbox'),
        theme: Blockly.Theme.defineTheme('gba_dark_theme', {
          'base': Blockly.Themes.Classic,
          'componentStyles': {
            'workspaceBackgroundColour': '#252526', 
            'toolboxBackgroundColour': '#111111',   
            'toolboxForegroundColour': '#ffffff',   
            'flyoutBackgroundColour': '#1a1a1a',    
            'flyoutForegroundColour': '#ffffff'     
          }
        })
      });

      if (workspace && workspace.registerButtonCallback) {
        workspace.registerButtonCallback('CREATE_VARIABLE', function(button) {
          Blockly.Variables.createVariableButtonHandler(button.getTargetWorkspace());
        });
      }

      setTimeout(function() {
        if (workspace) { Blockly.svgResize(workspace); }
      }, 100);
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      const t = document.getElementById('tab-' + tabName);
      if (t) { t.classList.add('active'); }
      if (event && event.target) { event.target.classList.add('active'); }
      if (tabName === 'code' && workspace) { setTimeout(function() { Blockly.svgResize(workspace); }, 50); }
    }

    function exportProject() {
      const n = document.getElementById('game-name').value || "GraGBA";
      const k = document.getElementById('game-code').value || "AGBA";
      const a = document.getElementById('game-author').value || "Anonim";
      
      let detectedSpritesheets = [];
      let detectedSounds = [];

      if (workspace) {
        const allBlocks = workspace.getAllBlocks(false);
        allBlocks.forEach(block => {
          // Wykrywanie tekstur / grafiki (.bmp)
          if (block.type === 'gba_txtr') {
            const fileBlock = block.getInputTargetBlock('PLIK');
            if (fileBlock && fileBlock.type === 'text') {
              const val = fileBlock.getFieldValue('TEXT');
              if (val && !detectedSpritesheets.includes(val)) {
                detectedSpritesheets.push(val);
              }
            }
          }
          // Wykrywanie plików audio (.wav)
          if (block.type === 'gba_sound') {
            const soundBlock = block.getInputTargetBlock('SFX_FILE');
            if (soundBlock && soundBlock.type === 'text') {
              const soundVal = soundBlock.getFieldValue('TEXT');
              if (soundVal && !detectedSounds.includes(soundVal)) {
                detectedSounds.push(soundVal);
              }
            }
          }
        });
      }

      // Manifest
      let manifestText = "-- Wygenerowano dla BPCore Engine\n";
      manifestText += "local app = {\n";
      manifestText += '    name = "' + n + '",\n';
      manifestText += '    gamecode = "' + k + '",\n';
      manifestText += '    author = "' + a + '",\n';
      
      // Sekcja Graficzna
      manifestText += "    spritesheets = {\n";
      detectedSpritesheets.forEach(asset => { 
        manifestText += '        "' + asset + '",\n'; 
      });
      manifestText += "    },\n";

      // Sekcja Audio
      manifestText += "    sounds = {\n";
      detectedSounds.forEach(sound => { 
        manifestText += '        "' + sound + '",\n'; 
      });
      manifestText += "    },\n";

      manifestText += '    scripts = { "main.lua" }\n';
      manifestText += "}\nreturn app";
      
      document.getElementById('output-manifest').value = manifestText;

      // Generowanie kodu Lua
      try {
        let generatedLua = Blockly.Lua.workspaceToCode(workspace);
        let mainLuaText = "-- Inicjalizacja systemowej zmiennej timera\n";
        mainLuaText += "local _timer_ms = 0\n\n";
        mainLuaText += generatedLua;
        
        if (!generatedLua || generatedLua.trim() === "") {
          mainLuaText += "-- Układaj bloki w pętli gry, aby wygenerować kod main.lua\n";
        }
        
        document.getElementById('output-main').value = mainLuaText;
      } catch (err) {
        document.getElementById('output-main').value = "-- Błąd generowania kodu: " + err.message;
      }
    }
  </script>
</body>
</html>
